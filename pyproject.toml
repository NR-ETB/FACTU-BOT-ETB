[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videofacturacion-etb"
version = "0.1.0"
description = "Prototipo local de guiones de facturación deterministas y verificables"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "streamlit>=1.42,<2", "pandas>=2.2,<4", "openpyxl>=3.1.5,<4",
  "jinja2>=3.1.6,<4", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
local-video = ["Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
etb-demo = "videofacturacion.demo:main"
etb-piloto-local = "videofacturacion.audiovisual.local_pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videofacturacion = ["scripts/templates/*.j2"]
"videofacturacion.audiovisual" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
